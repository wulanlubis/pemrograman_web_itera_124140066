<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan 5 - Pagination API</title>
<style>
body{font-family:Arial,sans-serif;max-width:560px;margin:30px auto;padding:0 16px}
label{display:block;margin-top:12px;font-weight:bold}
input,select{width:100%;padding:8px;box-sizing:border-box}
input.invalid{border:2px solid red}
.error{color:red;font-size:.85rem;min-height:1em}
button{padding:8px 14px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
li{padding:10px 0;border-bottom:1px solid #ddd}
ul{list-style:none;padding:0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<h2>Latihan 5: Pagination Data API</h2>
<p id="info">Memuat data...</p>
<ul id="daftar"></ul>
<div class="nav">
  <button id="btn-prev">Previous</button>
  <span id="halaman"></span>
  <button id="btn-next">Next</button>
</div>

<script>
const API = "https://jsonplaceholder.typicode.com/posts";
const PER_HALAMAN = 10;
let semuaPost = [];
let halamanSekarang = 1;

function totalHalaman() { return Math.ceil(semuaPost.length / PER_HALAMAN); }

function render() {
  const awal = (halamanSekarang - 1) * PER_HALAMAN;
  const data = semuaPost.slice(awal, awal + PER_HALAMAN);

  const ul = document.getElementById("daftar");
  ul.innerHTML = "";
  data.forEach(function (p) {
    const li = document.createElement("li");
    li.textContent = p.id + ". " + p.title;
    ul.appendChild(li);
  });

  document.getElementById("halaman").textContent =
    "Halaman " + halamanSekarang + " dari " + totalHalaman();
  document.getElementById("btn-prev").disabled = halamanSekarang === 1;
  document.getElementById("btn-next").disabled = halamanSekarang === totalHalaman();
}

document.getElementById("btn-prev").addEventListener("click", function () {
  if (halamanSekarang > 1) { halamanSekarang--; render(); }
});
document.getElementById("btn-next").addEventListener("click", function () {
  if (halamanSekarang < totalHalaman()) { halamanSekarang++; render(); }
});

async function muatPost() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error("Status " + res.status);
    semuaPost = await res.json();
    document.getElementById("info").textContent = "Total " + semuaPost.length + " post.";
    render();
  } catch (err) {
    document.getElementById("info").textContent = "Gagal memuat data: " + err.message;
  }
}

muatPost();
</script>
</body>
</html>
