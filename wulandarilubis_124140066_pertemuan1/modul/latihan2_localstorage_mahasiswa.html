<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan 2 - Mahasiswa + LocalStorage</title>
<style>
body{font-family:Arial,sans-serif;max-width:560px;margin:30px auto;padding:0 16px}
label{display:block;margin-top:12px;font-weight:bold}
input,select{width:100%;padding:8px;box-sizing:border-box}
input.invalid{border:2px solid red}
.error{color:red;font-size:.85rem;min-height:1em}
button{padding:8px 14px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
</style>
</head>
<body>
<h2>Latihan 2: Data Mahasiswa Tersimpan (LocalStorage)</h2>
<p>Tambah data, lalu refresh halaman. Data tidak hilang.</p>
<form id="form" novalidate>
  <label for="nama">Nama (min. 3 karakter)</label>
  <input type="text" id="nama"><div class="error" id="err-nama"></div>

  <label for="nim">NIM (9 digit angka)</label>
  <input type="text" id="nim" maxlength="9"><div class="error" id="err-nim"></div>

  <label for="jurusan">Jurusan</label>
  <select id="jurusan">
    <option value="">-- Pilih jurusan --</option>
    <option>Teknik Informatika</option>
    <option>Teknik Mesin</option>
    <option>Teknik Elektro</option>
    <option>Sains Data</option>
  </select>
  <div class="error" id="err-jurusan"></div>

  <button type="submit">Tambah</button>
</form>

<table>
  <thead><tr><th>No</th><th>Nama</th><th>NIM</th><th>Jurusan</th><th>Aksi</th></tr></thead>
  <tbody id="tabel"></tbody>
</table>
<button id="btn-kosongkan" style="margin-top:12px">Hapus semua data</button>

<script>
const KEY = "dataMahasiswa";
let mahasiswa = JSON.parse(localStorage.getItem(KEY)) || []; // string -> array

function simpan() { localStorage.setItem(KEY, JSON.stringify(mahasiswa)); } // array -> string

function setError(id, pesan) {
  document.getElementById("err-" + id).textContent = pesan;
  document.getElementById(id).classList.toggle("invalid", pesan !== "");
}

function render() {
  const tbody = document.getElementById("tabel");
  tbody.innerHTML = "";
  if (mahasiswa.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5">Belum ada data.</td></tr>';
    return;
  }
  mahasiswa.forEach(function (m, i) {
    const tr = document.createElement("tr");
    [i + 1, m.nama, m.nim, m.jurusan].forEach(function (teks) {
      const td = document.createElement("td");
      td.textContent = teks;
      tr.appendChild(td);
    });
    const tdAksi = document.createElement("td");
    const btn = document.createElement("button");
    btn.textContent = "Hapus";
    btn.addEventListener("click", function () {
      mahasiswa.splice(i, 1);
      simpan();
      render();
    });
    tdAksi.appendChild(btn);
    tr.appendChild(tdAksi);
    tbody.appendChild(tr);
  });
}

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  const nama = document.getElementById("nama").value.trim();
  const nim = document.getElementById("nim").value.trim();
  const jurusan = document.getElementById("jurusan").value;
  let valid = true;

  if (nama.length < 3) { setError("nama", "Nama minimal 3 karakter."); valid = false; }
  else setError("nama", "");

  if (!/^\d{9}$/.test(nim)) { setError("nim", "NIM harus 9 digit angka."); valid = false; }
  else if (mahasiswa.some(function (m) { return m.nim === nim; })) {
    setError("nim", "NIM sudah terdaftar."); valid = false;
  } else setError("nim", "");

  if (jurusan === "") { setError("jurusan", "Pilih salah satu jurusan."); valid = false; }
  else setError("jurusan", "");

  if (!valid) return;
  mahasiswa.push({ nama, nim, jurusan });
  simpan();
  this.reset();
  render();
});

document.getElementById("btn-kosongkan").addEventListener("click", function () {
  if (!confirm("Hapus semua data mahasiswa?")) return;
  mahasiswa = [];
  localStorage.removeItem(KEY);
  render();
});

render();
</script>
</body>
</html>
