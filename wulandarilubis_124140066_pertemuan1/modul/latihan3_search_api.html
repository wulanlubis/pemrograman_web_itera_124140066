<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan 3 - Search Post API</title>
<style>
body{font-family:Arial,sans-serif;max-width:560px;margin:30px auto;padding:0 16px}
label{display:block;margin-top:12px;font-weight:bold}
input,select{width:100%;padding:8px;box-sizing:border-box}
input.invalid{border:2px solid red}
.error{color:red;font-size:.85rem;min-height:1em}
button{padding:8px 14px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
li{padding:10px 0;border-bottom:1px solid #ddd}
ul{list-style:none;padding:0}
.info{color:#555}
</style>
</head>
<body>
<h2>Latihan 3: Cari Post berdasarkan Title</h2>
<input type="text" id="cari" placeholder="Ketik kata kunci title...">
<p class="info" id="info">Memuat data...</p>
<ul id="daftar"></ul>

<script>
const API = "https://jsonplaceholder.typicode.com/posts";
let semuaPost = [];

function render(data) {
  const ul = document.getElementById("daftar");
  ul.innerHTML = "";
  data.forEach(function (p) {
    const li = document.createElement("li");
    const judul = document.createElement("strong");
    judul.textContent = p.title;
    li.appendChild(judul);
    ul.appendChild(li);
  });
  document.getElementById("info").textContent =
    "Menampilkan " + data.length + " dari " + semuaPost.length + " post.";
}

function filterPost() {
  const kata = document.getElementById("cari").value.trim().toLowerCase();
  const hasil = semuaPost.filter(function (p) {
    return p.title.toLowerCase().includes(kata);
  });
  render(hasil);
  if (hasil.length === 0) {
    document.getElementById("info").textContent = "Tidak ada post yang cocok.";
  }
}

async function muatPost() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error("Status " + res.status);
    semuaPost = await res.json();
    render(semuaPost);
  } catch (err) {
    document.getElementById("info").textContent = "Gagal memuat data: " + err.message;
  }
}

document.getElementById("cari").addEventListener("input", filterPost);
muatPost();
</script>
</body>
</html>
