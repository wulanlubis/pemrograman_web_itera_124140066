<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan 4 - Dark Mode</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px;
         background: #ffffff; color: #1e293b; transition: background .2s, color .2s; }
  .kartu { border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; margin-top: 16px; }
  button { padding: 8px 14px; cursor: pointer; }

  /* Saat body punya class "dark", warna diganti */
  body.dark { background: #0f172a; color: #e2e8f0; }
  body.dark .kartu { border-color: #475569; background: #1e293b; }
</style>
</head>
<body>
<h2>Latihan 4: Dark Mode Toggle</h2>
<button id="btn-tema">Ganti ke mode gelap</button>

<div class="kartu">
  <h3>Contoh konten</h3>
  <p>Klik tombol di atas. Warna berubah karena class <code>dark</code>
     ditambah atau dihapus dari elemen <code>body</code>.</p>
</div>

<script>
const body = document.body;
const tombol = document.getElementById("btn-tema");

function perbaruiTombol() {
  tombol.textContent = body.classList.contains("dark")
    ? "Ganti ke mode terang" : "Ganti ke mode gelap";
}

tombol.addEventListener("click", function () {
  body.classList.toggle("dark");
  localStorage.setItem("tema", body.classList.contains("dark") ? "dark" : "light");
  perbaruiTombol();
});

// Ingat pilihan terakhir saat halaman dibuka lagi
if (localStorage.getItem("tema") === "dark") body.classList.add("dark");
perbaruiTombol();
</script>
</body>
</html>
